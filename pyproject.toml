[project]
name = "gguf-refine"
version = "0.1.0"
description = "Hessian-refined stock-format GGUF quantization, type allocation and KLD evaluation"
requires-python = ">=3.12"
# torch / triton: refinement; transformers / jinja2 / pyarrow: the corpus builder (tokenizer, chat templates, parquet);
# safetensors / sentencepiece / protobuf: convert_hf_to_gguf.py and the K3.1 weights; pyyaml / requests / tqdm: gguf-py
dependencies = ["numpy>=2", "torch>=2.5", "triton>=3.1", "transformers>=4.56", "jinja2>=3.1", "pyarrow>=15",
                "safetensors", "sentencepiece", "protobuf", "pyyaml", "requests", "tqdm"]

[tool.setuptools.packages.find]
include = ["ggufrefine*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
